<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>译述</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
    background: #141414;
    color: #e8e8e8;
  }
  header, main { padding: 20px 24px; }
  header { border-bottom: 1px solid #2a2a2a; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  p { margin: 0; }
  .lead { color: #9a9a9a; max-width: 62em; }
  #drop {
    margin-top: 12px;
    border: 1px dashed #444;
    border-radius: 8px;
    padding: 8px 12px;
    color: #888;
    font-size: 13px;
  }
  #drop.hot { border-color: #d7c4a3; color: #d7c4a3; }
  main {
    display: grid;
    grid-template-columns: 220px 1fr 280px;
    gap: 20px;
    align-items: start;
  }
  h2 { font-size: 13px; letter-spacing: 0.04em; color: #888; margin: 0 0 8px; }
  #tape, #claims { list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow: auto; }
  #tape button {
    width: 100%;
    text-align: left;
    background: transparent;
    color: #c8c8c8;
    border: 0;
    border-left: 2px solid transparent;
    padding: 4px 8px;
    font: inherit;
    cursor: pointer;
  }
  #tape button.on { border-left-color: #d7c4a3; color: #fff; background: #222; }
  #claims li { padding: 6px 0 6px 14px; color: #666; }
  #claims li.on { color: #d7c4a3; }
  #stage { position: sticky; top: 16px; }
  #caption { font-size: 22px; margin: 8px 0 16px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  button.ctrl {
    background: #222;
    color: #eee;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  #pos { color: #888; align-self: center; }
  #state p { margin: 0 0 10px; }
  #state span {
    display: block;
    color: #888;
    font-size: 12px;
  }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #tape, #claims { max-height: 28vh; }
  }
</style>
</head>
<body>
<header>
  <h1>译述</h1>
  <p class="lead">终端说了 hello。clerk 在 box 还没发布时就被登记处拒绝，那一次不落磁带。接着权利不够的两次挂载被拒绝。clerk 先把信发到一个没挂上的地址，再发给 box。translator 在路上把载荷改成译:hello。scribe 把这句译文写进 editor。naive 想把原文塞进去，被挡住。卸下之后译文还在 editor 里。内嵌的是探针跑出来的一条磁带；把别的 jsonl 拖到下面可以换一条。</p>
  <div id="drop">把 tape.jsonl 拖到这里</div>
</header>
<main>
  <section>
    <h2>磁带</h2>
    <ol id="tape"></ol>
  </section>
  <section id="stage">
    <div class="row">
      <button class="ctrl" id="prev" type="button">上一条</button>
      <button class="ctrl" id="next" type="button">下一条</button>
      <button class="ctrl" id="play" type="button">连续</button>
      <span id="pos"></span>
    </div>
    <p id="caption"></p>
    <div id="state"></div>
  </section>
  <section>
    <h2>到这一条为止</h2>
    <ul id="claims"></ul>
  </section>
</main>
<script type="module" src="/main.js"></script>
</body>
</html>
