/* The workspace cover changes palette with the scene. */
:root {
  --indigo: #4858ae;
  --line: #e4e6ea;
  --muted: #636975;
  background: #fdfdfd;
}
.rail { background: linear-gradient(148deg,#f4f5f7,#f5f5f8 75%,#eeeff5); }
.brand { font-weight: 670; padding-bottom: 36px; }
.brand img { border-radius: 9px; box-shadow: 0 1px 5px #1112; }
.create-wide { display:flex; align-items:center; gap:9px; border:1px solid #dcdfe5; border-radius:9px; background:#ffffffc9; margin:0 5px 10px; padding:8px 10px; font-size:13px; text-align:left; }
.create-wide b { font-weight:400; font-size:19px; line-height:1; }
#create { display:none; }
.nav-item.active { background:#e1e5ef; color:#303b58; }
.content { max-width:1120px; padding-top:30px; }
.toolbar { background:#ffffffdb; }
.hero {
  --sky: #25345a; --haze:#bd8295; --mountain:#494263; --foreground:#2f314c;
  min-height:228px; display:flex; align-items:center; padding:34px 38px;
  border:none; border-radius:22px; color:#fff;
  background: radial-gradient(ellipse at 85% 88%,var(--haze),transparent 60%),linear-gradient(112deg,#171e33,var(--sky) 65%,var(--haze));
}
.hero::after { content:''; position:absolute; inset:0; z-index:1; background:linear-gradient(90deg,#192035b3,transparent 88%); }
.hero-copy { width:70%; }
.hero h1 { font-size:clamp(30px,3.7vw,49px); margin:8px 0 10px; overflow-wrap:anywhere; }
.hero .eyebrow { color:#e4e8ff; font-size:12px; letter-spacing:.12em; }
.hero p { color:#f7f4ff; max-width:48ch; }
.master { color:#fff; background:#ffffff12; border:1px solid #ffffff3b; border-radius:30px; padding:4px 10px; margin-top:19px; }
.master .dot { background:#bbe2d1; }
.landscape,.ridge { position:absolute; inset:0; }
.landscape { pointer-events:none; overflow:hidden; }
.moon { position:absolute; right:13%; top:16%; width:52px; aspect-ratio:1; border-radius:50%; background:linear-gradient(145deg,#fff4dd,#f8dbd5); box-shadow:0 0 64px 12px #ffdab233; }
.ridge.far { background:linear-gradient(158deg,#968d9e,var(--mountain) 76%); clip-path:polygon(0 100%,0 81%,29% 72%,41% 78%,64% 49%,71% 57%,81% 37%,89% 44%,100% 26%,100% 100%); }
.ridge.near { background:linear-gradient(160deg,var(--mountain),var(--foreground) 76%); clip-path:polygon(0 100%,0 85%,22% 79%,42% 89%,53% 83%,68% 89%,85% 60%,94% 65%,100% 51%,100% 100%); }
.segment { margin:24px 0 0; }
.pending { display:flex; align-items:center; gap:14px; padding:17px 19px; background:#f7f8fc; margin-top:22px; }
.request-copy { flex:1; }
.request-copy p { margin:4px 0 0; font-size:13px; }
.primary { background:#38426f; }
.primary:hover:enabled { background:#273153; }
.secondary { background:#e9ebf3; }
.primary,.secondary,.pick,.create-wide,.row { transition:background .15s ease,box-shadow .15s ease; }
.usage:hover,.create-wide:hover { background:#f4f5fa; }
.badge { background:#edf4f0; border-radius:20px; padding:2px 9px; }
.filters { display:flex; gap:6px; flex-wrap:wrap; }
.filter,.pick { border-radius:15px; padding:5px 12px; font-size:13px; }
.filter[aria-pressed=true] { background:#292e3c; color:white; }
.filter[aria-pressed=false]:hover { background:#f1f2f5; }
.product { border:1px solid var(--line); border-radius:18px; background:linear-gradient(152deg,color-mix(in srgb,var(--pale) 22%,white),white 72%); gap:6px; }
.product.selected { border-color:#aab5d2; }
.product-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
.product-head .tile { width:48px; height:48px; font-size:28px; border-radius:14px; }
.pick { color:#414c75; background:#ebeef6; }
.pick[aria-pressed=true] { background:#dce3f3; }
.product details { margin-top:auto; padding:9px 0 0; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
.product p { color:var(--muted); line-height:1.6; }
.market-footer { display:flex; gap:8px; align-items:center; position:sticky; bottom:14px; margin-top:18px; padding:12px 14px; border:1px solid var(--line); border-radius:15px; background:#fffffff2; backdrop-filter:blur(16px); box-shadow:0 3px 18px #2639580d; }
.market-footer span { margin-right:auto; }
.choice { cursor:pointer; }
.choice:has(:checked) { background:#f5f6fb; }
#breadcrumb { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
@media(max-width:600px) {
  .create-wide { display:none; }
  #create { display:grid; }
  .hero { padding:23px; min-height:210px; }
  .hero-copy { width:88%; }
  .moon { width:34px; right:6%; top:11%; }
  .pending { display:grid; grid-template-columns:38px 1fr; }
  .pending button { grid-column:2; justify-self:start; }
  .market-footer { bottom:6px; }
}
@media(prefers-reduced-motion:reduce) { *,*::after { transition:none !important; } }

#language { margin-left:auto; flex:none; border:1px solid var(--line); border-radius:14px; padding:5px 8px; background:white; color:inherit; font:inherit; cursor:pointer; }
#language:focus-visible { outline:3px solid #998be2; outline-offset:2px; }
@media(max-width:600px) { .toolbar { gap:6px; } }

.welcome-action { margin-top:18px; }
</style></head>

"use strict";
const languageKey = 'an-agent.workbench.language';
function initialLanguage() {
    try {
        const saved = localStorage.getItem(languageKey);
        if (saved === 'zh-CN' || saved === 'en')
            return saved;
    }
    catch { /* Continue with browser preferences. */ }
    for (const tag of navigator.languages?.length ? navigator.languages : [navigator.language]) {
        if (/^zh(?:-|$)/i.test(tag))
            return 'zh-CN';
        if (/^en(?:-|$)/i.test(tag))
            return 'en';
    }
    return 'en';
}
let language = initialLanguage();
const t = (zh, en) => language === 'en' ? en : zh;
const source = window.workbenchSource;
const key = source?.storageKey ?? 'an-agent.workbench.v1';
const catalog = source?.catalog ?? [];
const byId = (id) => catalog.find(item => item.id === id);
const spoolName = (id) => id === 'master' ? 'Master Agent' : byId(id).name;
const format = (n) => n.toLocaleString(language);
function blank(id, name, intent, installed) {
    return { id, name, intent, installed, artifacts: [], receipts: [], usage: [], integration: 'none' };
}
function valid(w) {
    const text = (x) => typeof x === 'string';
    const known = (id) => catalog.some(m => m.id === id);
    const endpoint = (id) => id === 'master' || known(id);
    return !!w && [w.id, w.name, w.intent].every(text) && Array.isArray(w.installed) && w.installed.every(known)
        && Array.isArray(w.artifacts) && w.artifacts.every(a => a && known(a.spool) && [a.file, a.revision, a.agent].every(text))
        && Array.isArray(w.receipts) && w.receipts.every(r => r && endpoint(r.from) && endpoint(r.to) && [r.file, r.revision].every(text))
        && Array.isArray(w.usage) && w.usage.every(u => u && text(u.agent) && [u.input, u.output].every(n => Number.isSafeInteger(n) && n >= 0))
        && ['pending', 'done', 'none'].includes(w.integration);
}
function restore() {
    try {
        const data = JSON.parse(localStorage.getItem(key) ?? 'null');
        if (data?.version === 1 && Array.isArray(data.spaces) && data.spaces.length && data.spaces.every(valid) && data.spaces.some((w) => w.id === data.active))
            return data;
    }
    catch { /* Storage may be unavailable for local HTML. */ }
    return source?.initialState() ?? { version: 1, active: '', spaces: [] };
}
const store = restore();
const ws = () => store.spaces.find(w => w.id === store.active);
function save() {
    try {
        localStorage.setItem(key, JSON.stringify(store));
    }
    catch {
        get('storage-note').textContent = t(translations.storageUnavailable, 'Browser storage is unavailable. Changes last for this session.');
    }
}
function load(w, id) {
    if (w.installed.includes(id))
        return;
    w.installed.push(id);
    source?.afterLoad?.(w, id);
}
function get(id) { return document.getElementById(id); }
function node(tag, cls = '', text = '') {
    const el = document.createElement(tag);
    if (cls)
        el.className = cls;
    if (text)
        el.textContent = text;
    return el;
}
function button(text, cls, fn) {
    const b = node('button', cls, text);
    b.type = 'button';
    b.onclick = fn;
    return b;
}
function tile(m) { const t = node('span', 'tile ' + m.theme, m.glyph); t.setAttribute('aria-hidden', 'true'); return t; }
function datum(a, b) {
    const d = node('div', 'datum');
    d.append(node('span', '', a), node('span', '', b));
    return d;
}
function heading(title, action) {
    const h = node('div', 'section-head');
    h.append(node('h2', '', title));
    if (action)
        h.append(action);
    return h;
}
function record(title, detail) {
    const d = node('details');
    d.append(node('summary', '', title), node('p', '', detail));
    return d;
}
const main = get('content'), sheet = get('sheet'), body = get('sheet-body');
let page = 'space', tab = 'overview';
function modal(context, title) {
    get('sheet-context').textContent = context;
    const heading = node('h2', '', title);
    heading.id = 'sheet-title';
    body.replaceChildren(heading);
    if (!sheet.open)
        sheet.showModal();
}
get('close').onclick = () => sheet.close();
sheet.onclick = e => { if (e.target === sheet) {
    const r = sheet.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)
        sheet.close();
} };
function total(w) { return w.usage.reduce((s, u) => s + u.input + u.output, 0); }
function usageView() {
    const w = ws();
    modal(w.name, t(translations.tokenUsage, 'Token usage'));
    if (!w.usage.length) {
        body.append(node('p', 'empty', t(translations.noUsage, 'No usage recorded yet.')));
        return;
    }
    const tokens = total(w), input = w.usage.reduce((s, u) => s + u.input, 0);
    body.append(node('p', 'sub', t(translations.totalUsage, 'Total usage')), node('div', 'number', format(tokens)));
    const bar = node('div', 'meter'), part = node('i');
    part.style.width = (100 * input / (tokens || 1)) + '%';
    bar.append(part);
    body.append(bar, datum(t(translations.input, 'Input'), format(input)), datum(t(translations.output, 'Output'), format(tokens - input)), heading(t(translations.byAgent, 'By agent')));
    for (const agent of new Set(w.usage.map(u => u.agent))) {
        const records = w.usage.filter(u => u.agent === agent);
        body.append(datum(agent, format(records.reduce((s, u) => s + u.input + u.output, 0))));
    }
}
function selectedCount(n) { return t(translations.selectedPrefix + n + translations.selectedSuffix, n + ' selected'); }
function createView() {

    intent.id = 'new-intent';
    intent.maxLength = 1200;
    intent.placeholder = t(translations.goalPlaceholder, 'What should the master agent deliver?');
    intent.rows = 2;
    function label(text, id) { const l = node('label', 'form-label', text); l.htmlFor = id; return l; }
    form.append(label(t(translations.name, 'Name'), name.id), name, label(t(translations.optionalGoal, 'Goal (optional)'), intent.id), intent, node('p', 'form-label', t(translations.chooseSpools, 'Choose Spools')));
    if (!catalog.length)
        form.append(node('p', 'sub', t(translations.emptyCatalog, 'No Spools are available yet. You can still create this workspace.')));
    const choices = catalog.map(m => {
        const l = node('label', 'choice'), input = node('input');
        input.type = 'checkbox';
        input.value = m.id;
        const copy = node('span', 'row-text');
        copy.append(node('strong', '', m.name), node('small', '', m.input + ' → ' + m.output));
        l.append(tile(m), copy, input);
        form.append(l);
        return input;
    });
    const footer = node('div', 'footer-actions'), count = node('span', 'sub', selectedCount(0));
    form.onchange = () => count.textContent = selectedCount(choices.filter(c => c.checked).length);
    const submit = node('button', 'primary', t(translations.create, 'Create workspace'));
    submit.type = 'submit';
    footer.append(count, submit);
    form.append(footer);
    form.onsubmit = e => {
        e.preventDefault();
        const title = name.value.trim();
        if (!title || store.spaces.some(w => w.name === title)) {
            name.setCustomValidity(title ? t(translations.duplicateWorkspace, 'A workspace with this name already exists.') : t(translations.enterWorkspaceName, 'Enter a workspace name.'));
            name.reportValidity();
            return;
        }
        const w = blank(crypto.randomUUID(), title, intent.value.trim(), choices.filter(c => c.checked).map(c => c.value));
        store.spaces.push(w);
        store.active = w.id;
        page = 'space';
        tab = 'overview';
        save();
        sheet.close();
        render();
    };
    name.oninput = () => name.setCustomValidity('');
    body.append(form);
    name.focus();
}
function artifactList(items) {
    const box = node('div', 'panel');
    if (!items.length)
        box.append(node('span', 'sub', t(translations.noArtifacts, 'No accepted artifacts yet.')));
    for (const a of items)
        box.append(record(a.file, spoolName(a.spool) + ' · ' + a.agent + t(translations.acceptedSeparator, ' · Accepted · ') + a.revision));
    return box;
}
function receiptList(items) {
    const box = node('div', 'panel');
    if (!items.length)
        box.append(node('span', 'sub', t(translations.noTransfers, 'No transfers yet.')));
    for (const r of items)
        box.append(record(r.file + '　·　' + spoolName(r.from) + ' → ' + spoolName(r.to), t(translations.consumptionConfirmed, 'Consumption confirmed · ') + r.revision));
    return box;
}
function spoolView(id, request = false) {
    const w = ws(), m = byId(id), installed = w.installed.includes(id);
    modal(w.name + '　/　' + (request ? t(translations.loadRequest, 'Load request') : 'Spool'), m.name);
    body.append(node('p', 'intro', m.description), datum(t(translations.input, 'Input'), m.input), datum(t(translations.output, 'Output'), m.output));
    if (m.version)
        body.append(datum(t(translations.version, 'Version'), m.version));
    if (request)
        body.append(datum(t(translations.requestedBy, 'Requested by'), 'Master Agent'));
    if (installed) {
        const products = w.artifacts.filter(a => a.spool === id);
        body.append(datum(t(translations.status, 'Status'), t(translations.loadedIdle, 'Loaded · Idle')), datum(t(translations.lastUsed, 'Last used by'), products.length ? products.at(-1).agent : t(translations.noRuns, 'No runs yet')), heading(t(translations.artifacts, 'Artifacts')), artifactList(products), heading(t(translations.transfers, 'Transfers')), receiptList(w.receipts.filter(r => r.from === id || r.to === id)));
    }
    const f = node('div', 'footer-actions');
    f.append(node('span', 'sub', installed ? t(translations.removalRetention, 'Artifacts and history are kept after removal.') : t(translations.workspaceScope, 'Applies to this workspace only.')));
    f.append(button(installed ? t(translations.removeSpool, 'Remove Spool') : request ? t(translations.approveLoad, 'Approve and load') : t(translations.addToWorkspace, 'Add to workspace'), installed ? 'secondary' : 'primary', () => {
        if (installed)
            w.installed = w.installed.filter(x => x !== id);
        else
            load(w, id);
        save();
        sheet.close();
        render();
    }));
    body.append(f);
}
let marketDraft = { selected: new Set(), category: '', search: '' };
function market() {
    marketDraft = { selected: new Set(ws().installed), category: '', search: '' };
    page = 'market';
    render();
}
function marketView() {
    const w = ws();
    main.append(node('div', 'eyebrow', t(translations.library, 'Library')), node('h1', '', 'Spool Market'), node('p', 'intro', t(translations.chooseCapabilitiesPrefix + w.name + translations.chooseCapabilitiesSuffix, 'Choose capabilities for ' + w.name + '.')));
    if (!catalog.length) {
        main.append(node('p', 'empty', t(translations.noSpools, 'No Spools available yet.')), button(t(translations.backToWorkspace, 'Back to workspace'), 'secondary', () => { page = 'space'; render(); }));
        return;
    }
    const search = node('input', 'search');
    search.type = 'search';
    search.placeholder = t(translations.searchSpools, 'Search Spools, inputs or outputs');
    search.setAttribute('aria-label', search.placeholder);
    const grid = node('div', 'market-grid'), filters = node('div', 'filters');
    const selected = marketDraft.selected;
    let category = marketDraft.category;
    search.value = marketDraft.search;
    const footer = node('div', 'market-footer'), summary = node('span', 'sub');
    const back = button(t(translations.backToWorkspace, 'Back to workspace'), 'secondary', () => { page = 'space'; render(); });
    const apply = button(t(translations.saveSelection, 'Save selection'), 'primary', () => {
        w.installed = w.installed.filter(id => selected.has(id));
        for (const id of selected)
            if (!w.installed.includes(id))
                load(w, id);
        save();
        page = 'space';
        tab = 'overview';
        render();
    });
    function update() {
        const changed = w.installed.length !== selected.size || w.installed.some(id => !selected.has(id));
        summary.textContent = selectedCount(selected.size);
        back.textContent = changed ? t(translations.discardChanges, 'Discard changes') : t(translations.backToWorkspace, 'Back to workspace');
        apply.disabled = !changed;
    }
    function results() {
        grid.replaceChildren();
        const q = search.value.trim().toLowerCase();
        for (const m of catalog.filter(m => (!category || m.theme === category) && [m.name, m.category, m.description, m.input, m.output].join(' ').toLowerCase().includes(q))) {
            const card = node('article', 'product ' + m.theme);
            const head = node('div', 'product-head'), select = button('', 'pick', () => {
                if (selected.has(m.id))
                    selected.delete(m.id);
                else
                    selected.add(m.id);
                refresh();
                update();
            });
            function refresh() {
                const on = selected.has(m.id);
                select.textContent = on ? t(translations.selected, '✓ Selected') : t(translations.select, '+ Select');
                select.setAttribute('aria-label', m.name + ' · ' + select.textContent);
                select.setAttribute('aria-pressed', String(on));
                card.classList.toggle('selected', on);
            }
            refresh();
            head.append(tile(m), select);
            const spec = record(t(translations.capabilityManifest, 'Capability manifest'), m.input + ' → ' + m.output + (m.version ? ' · v' + m.version : ''));
            card.append(head, node('h3', '', m.name), node('p', '', m.description), spec);
            grid.append(card);
        }
        if (!grid.children.length)
            grid.append(node('p', 'empty', t(translations.noMatchingSpools, 'No matching Spools.')));
    }
    for (const [id, label] of [['', t(translations.all, 'All')], ...catalog.map(m => [m.theme, m.category])]) {
        const chip = button(label, 'filter', () => {
            marketDraft.category = category = id;
            for (const item of Array.from(filters.children))
                item.setAttribute('aria-pressed', String(item === chip));
            results();
        });
        chip.setAttribute('aria-pressed', String(id === category));
        filters.append(chip);
    }
    search.oninput = () => { marketDraft.search = search.value; results(); };
    footer.append(summary, back, apply);
    main.append(search, filters, grid, footer);
    update();
    results();
}
function overview(w) {
    const request = source?.request?.(w);
    if (request && catalog.some(m => m.id === request.spool)) {
        const candidate = byId(request.spool);
        const panel = node('article', 'panel pending');
        const message = node('div', 'request-copy');
        message.append(node('h3', '', t(translations.loadPromptPrefix + candidate.name + '」？', 'Load ' + candidate.name + '?')), node('p', '', request.reason));
        panel.append(tile(candidate), message, button(t(translations.reviewRequest, 'Review request'), 'secondary', () => spoolView(candidate.id, true)));
        main.append(panel);
    }
    main.append(heading(t(translations.loadedSpools, 'Loaded Spools · ') + w.installed.length, button(t(translations.chooseSpoolsAction, 'Choose Spools +'), 'link', market)));
    const list = node('div', 'list');
    if (!w.installed.length)
        list.append(node('p', 'empty', t(translations.emptyInstalled, 'No Spools loaded. Choose capabilities for this pipeline in the Market.')));
    for (const id of w.installed) {
        const m = byId(id), a = w.artifacts.filter(a => a.spool === id), row = button('', 'row', () => spoolView(id)), text = node('span', 'row-text');
        text.append(node('strong', '', m.name), node('small', '', a.length ? a.at(-1).agent + ' · ' + t(a.length + translations.artifactsSuffix, a.length + (a.length === 1 ? ' artifact' : ' artifacts')) : t(translations.noRuns, 'No runs yet')));
        row.append(tile(m), text, node('span', 'badge', t(translations.idle, 'Idle')), node('span', 'chevron', '›'));
        list.append(row);
    }
    main.append(list);
}
function workspaceView() {
    const w = ws(), hero = node('header', 'hero'), copy = node('div', 'hero-copy');
    const status = node('span', 'master');
    status.append(node('i', 'dot'), document.createTextNode('Master Agent · ' + (w.integration === 'pending' ? t(translations.awaitingApproval, 'Awaiting approval') : w.integration === 'done' ? t(translations.delivered, 'Delivered') : t(translations.ready, 'Ready'))));
    copy.append(node('div', 'eyebrow', 'Workspace'), node('h1', '', w.name));
    if (w.intent)
        copy.append(node('p', '', w.intent));
    copy.append(status);
    hero.append(copy, get('hero-art').content.cloneNode(true));
    main.append(hero);
    const tabs = node('div', 'segment');
    for (const [name, label] of [['overview', t(translations.overview, 'Overview')], ['artifacts', t(translations.artifacts, 'Artifacts')], ['transfers', t(translations.transfers, 'Transfers')]]) {
        const b = button(label, tab === name ? 'active' : '', () => { tab = name; render(); main.querySelector('.segment .active')?.focus(); });
        b.setAttribute('aria-pressed', String(tab === name));
        tabs.append(b);
    }
    main.append(tabs);
    if (tab === 'overview')
        overview(w);
    if (tab === 'artifacts')
        main.append(heading(t(translations.acceptedArtifacts, 'Accepted artifacts')), artifactList(w.artifacts));
    if (tab === 'transfers')
        main.append(heading(t(translations.artifactTransfers, 'Artifact transfers')), receiptList(w.receipts));
}
function render() {
    document.documentElement.lang = language;
    document.title = t(translations.pageTitle, 'an-agent · Workbench');
    get('space-label').textContent = t(translations.workspaces, 'Workspaces');
    get('new-label').textContent = t(translations.newWorkspace, 'New workspace');
    get('library-label').textContent = t(translations.library, 'Library');
    get('demo-label').textContent = source ? t(translations.localDemo, 'Local demo') : t(translations.localWorkbench, 'Local workbench');
    get('create').title = t(translations.createWorkspace, 'Create workspace');
    get('create').setAttribute('aria-label', get('create').title);
    get('spaces').setAttribute('aria-label', t(translations.chooseWorkspace, 'Choose workspace'));
    get('usage').setAttribute('aria-label', t(translations.viewUsage, 'View workspace token usage'));
    get('close').setAttribute('aria-label', t(translations.close, 'Close'));
    if (get('storage-note').textContent)
        get('storage-note').textContent = t(translations.storageUnavailable, 'Browser storage is unavailable. Changes last for this session.');
    get('language').value = language;
    const w = ws(), spaces = get('spaces');
    spaces.replaceChildren();
    get('market-nav').disabled = !w;
    get('usage').disabled = !w;
    if (!w) {
        get('breadcrumb').textContent = t(translations.workbench, 'Workbench');
        get('usage-value').textContent = t(translations.zeroUsage, 'Token usage · 0');
        main.replaceChildren(node('h1', '', t(translations.firstWorkspace, 'Create your first workspace')), node('p', 'intro', t(translations.workspaceIntro, 'Set a goal for your pipeline and choose the Spools it can use.')), button(t(translations.createWorkspace, 'New workspace'), 'primary welcome-action', createView));
        return;
    }
    for (const space of store.spaces) {
        const active = space.id === w.id;
        const b = button('', 'nav-item' + (active ? ' active' : ''), () => { store.active = space.id; page = 'space'; tab = 'overview'; save(); render(); });
        b.append(node('i', 'space-mark'), node('span', '', space.name));
        b.setAttribute('aria-pressed', String(active));
        spaces.append(b);
    }
    get('market-nav').classList.toggle('active', page === 'market');
    get('market-nav').setAttribute('aria-pressed', String(page === 'market'));
    get('breadcrumb').textContent = w.name + '　/　' + (page === 'market' ? 'Spool Market' : t(translations.workbench, 'Workbench'));
    get('usage-value').textContent = t(translations.usagePrefix, 'Token usage · ') + format(total(w));
    main.replaceChildren();
    if (page === 'market')
        marketView();
    else
        workspaceView();
}
get('language').onchange = e => {
    language = e.currentTarget.value === 'en' ? 'en' : 'zh-CN';
    try {
        localStorage.setItem(languageKey, language);
    }
    catch { /* Session-only preference. */ }
    render();
};
get('usage').onclick = usageView;
get('create').onclick = createView;
get('create-wide').onclick = createView;

render();
