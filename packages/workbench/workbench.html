<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>an-agent · Workspace</title><link rel="icon" href="__APP_ICON__"><style>/* STYLES */</style></head>
<body>
<div class="app">
<aside class="rail">
  <div class="brand"><img src="__APP_ICON__" alt="" width="34" height="34">an-agent</div>
  <div class="rail-group"><span id="space-label">Workspaces</span><button id="create" class="plus" title="Create workspace" aria-label="Create workspace">＋</button></div>
  <button id="create-wide" class="create-wide"><b aria-hidden="true">＋</b> <span id="new-label">New workspace</span></button><nav id="spaces" aria-label="Choose workspace"></nav>
  <div id="library-label" class="rail-group library-label">Library</div>
  <button id="market-nav" class="nav-item"><span class="grid-mark" aria-hidden="true">⊞</span>Spool Market</button>
  <div class="rail-foot"><span class="dot"></span><span id="demo-label">Local workbench</span></div>
</aside>
<main>
  <header class="toolbar"><span id="breadcrumb"></span><select id="language" aria-label="Interface language"><option value="zh-CN" lang="zh-CN">Chinese (Simplified)</option><option value="en" lang="en">English</option></select><button id="usage" class="usage" aria-label="View workspace token usage"><span class="usage-bars" aria-hidden="true">▂▅▇</span><span id="usage-value"></span></button></header>
  <div id="content" class="content"></div>
  <p id="storage-note" role="status"></p>
</main></div>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="modal-head"><span id="sheet-context"></span><button id="close" class="icon-button" aria-label="Close">×</button></div><div id="sheet-body"></div></dialog>
<template id="hero-art"><div class="landscape" aria-hidden="true"><i class="moon"></i><i class="ridge far"></i><i class="ridge near"></i></div></template>
<script>/* SCRIPT */</script></body></html>
