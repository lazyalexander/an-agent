[workspace]
resolver = "2"
members = ["crates/an-agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = { version = "0.8", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rhai = { version = "1", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
ulid = { version = "1", features = ["std"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
libc = "0.2"

# Small deny list, enforced via [lints] workspace = true in each member.
# unwrap/expect stay allowed in tests (see clippy.toml allow-*-in-tests).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
