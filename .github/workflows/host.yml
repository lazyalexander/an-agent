name: Host acceptance

on:
  pull_request:
    branches: [dev-advance, main]
  push:
    branches: [dev-advance, main]

permissions:
  contents: read

jobs:
  native-host:
    name: native-host (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_workspace: false
          - os: macos-latest
            native_workspace: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install repository-pinned Rust toolchain
        run: |
          active="$(rustup show active-toolchain | awk '{print $1}')"
          rustup default "$active"
          # Hosted runners can carry different unused stable versions. rust-cache
          # keys all installed toolchains; keep only the selected one in this job.
          while read -r toolchain _; do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done < <(rustup toolchain list --quiet)
          rustc --version --verbose
          cargo --version
      - name: Restore Rust dependency caches
        id: rust-cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          prefix-key: host-deps-v1
          key: ${{ runner.os }}-${{ runner.arch }}
          workspaces: |
            . -> target
            tools/archcheck -> target
          cache-bin: false
      - run: cargo fmt --all -- --check
      - name: Compile all workspace test binaries
        run: cargo test --workspace --locked --no-run
      - name: Execute all workspace tests
        run: cargo test --workspace --locked
        env:
          AN_AGENT_ACCEPTANCE_DIR: ${{ runner.temp }}/native-concurrency
      - name: Retain native lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-lifecycle-${{ matrix.os }}
          path: ${{ runner.temp }}/native-concurrency
          if-no-files-found: warn
          retention-days: 14
      - name: Native spool state CLI acceptance
        if: matrix.native_workspace
        run: python3 crates/an-agent-host/tests/cli/native_state.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state"
      - name: Native release review and independent continuation
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_release.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/release-review"
      - name: Native workspace event delivery and cancellation
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_events.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/events"
      - name: Concurrent observation and revocation without retries
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_monitor.py --host target/debug/an-agent-host --fixture "$RUNNER_TEMP/native-state/events" --evidence "$RUNNER_TEMP/native-state/monitor-concurrency"
      - name: Native Python runtime and binary event custody
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_binary.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/binary"
      - name: Independent business data and state with cancellation retention
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_data_state.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/data-state"
      - name: Native input references and confirmed cancelled-owner release
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_input_references.py --host target/debug/an-agent-host --fixture "$RUNNER_TEMP/native-state/data-state" --evidence "$RUNNER_TEMP/native-state/input-references"
      - name: Finite explicit event dispatch, stop, cancellation and no replay
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_dispatch.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/dispatch"
      - name: Native sessions, scoped cancellation and unknown-result retention
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_sessions.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/sessions"
      - name: Foreground supervisor loss and uncertain custody
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_supervisor_loss.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/supervisor-loss"
      - name: Native private materials and inert notes
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_material_boundary.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/material-boundary"
      - name: Native split-phase peer requests and generation-bound replies
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_peer.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/peers"
      - name: Native receiver cutover and preserved historical custody
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_route_successor.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/route-successor"
      - name: Multi-round native capacity maintenance and retained products
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_capacity.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/capacity"
      - name: Native artifact retirement and admitted downstream custody
        if: matrix.native_workspace
        run: python3 -B crates/an-agent-host/tests/cli/native_retirement.py --host target/debug/an-agent-host --evidence "$RUNNER_TEMP/native-state/retirement"
      - name: Retain native state evidence
        if: always() && matrix.native_workspace
        uses: actions/upload-artifact@v4
        with:
          name: native-state-${{ matrix.os }}
          path: ${{ runner.temp }}/native-state
          if-no-files-found: warn
          retention-days: 14
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Architecture tool tests and lint
        run: |
          cargo fmt --manifest-path tools/archcheck/Cargo.toml -- --check
          cargo test --manifest-path tools/archcheck/Cargo.toml --locked
          cargo clippy --manifest-path tools/archcheck/Cargo.toml --all-targets --locked -- -D warnings
      - name: Architecture gate
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          test -n "$base"
          cargo arch --base "$base"
      - name: Record cache observation
        if: always()
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          printf 'Rust dependency cache exact hit: `%s`\n' "$CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
          printf 'Both workspace target directories are covered; all validation steps still run.\n' >> "$GITHUB_STEP_SUMMARY"
