[package]
name = "an-agent-host"
description = "The embedding surface: mount spools from workspace config, pump replies into intents and applied landings"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
an-agent-core = { path = "../an-agent-core" }
an-agent-spool = { path = "../an-agent-spool" }
reqwest.workspace = true
tokio.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5"

[dev-dependencies]
an-agent-core = { path = "../an-agent-core", features = ["testkit"] }
an-agent-spool = { path = "../an-agent-spool" }
uuid.workspace = true
