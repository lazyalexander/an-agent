[package]
name = "an-agent-host"
description = "Host-owned package admission, task lifecycle, backend execution and artifact custody"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
embedded-rhai = ["dep:rhai"]

[dependencies]
rhai = { workspace = true, optional = true }
serde-saphyr.workspace = true
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.36", features = ["bundled"] }
an-agent-core = { path = "../an-agent-core" }
tokio.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5"

[dev-dependencies]
toml.workspace = true
an-agent-core = { path = "../an-agent-core", features = ["testkit"] }
uuid.workspace = true
