<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>An</title><style>

<header><h1>An</h1><select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></header>
